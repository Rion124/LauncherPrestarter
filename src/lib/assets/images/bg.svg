<svg xmlns="http://www.w3.org/2000/svg" width="512" height="299" viewBox="0 0 512 299" fill="none">
  <defs>
    <!-- Dark iron base, warmer towards the bottom -->
    <linearGradient id="iron" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1D150E"/>
      <stop offset="55%" stop-color="#171009"/>
      <stop offset="100%" stop-color="#120E0A"/>
    </linearGradient>
    <!-- Ember glow rising from behind the horizon, like the launcher hero -->
    <radialGradient id="glow" cx="0.5" cy="1.05" r="0.85">
      <stop offset="0%" stop-color="#F2871E" stop-opacity="0.42"/>
      <stop offset="45%" stop-color="#B4470F" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#B4470F" stop-opacity="0"/>
    </radialGradient>
    <!-- Warm top sheen so the rounded window edge catches light -->
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFB24C" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#FFB24C" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="rounded">
      <rect width="512" height="299" rx="10"/>
    </clipPath>
  </defs>

  <g clip-path="url(#rounded)">
    <rect width="512" height="299" fill="url(#iron)"/>
    <rect width="512" height="299" fill="url(#glow)"/>
    <rect width="512" height="120" fill="url(#sheen)"/>

    <!-- Distant ridge, echoing the launcher's mountains -->
    <path d="M0 299 L0 244 L58 214 L112 240 L168 196 L232 236 L286 204 L344 238 L402 210 L458 240 L512 218 L512 299 Z"
          fill="#0C0906" opacity="0.55"/>

    <!-- Faint ember sparks -->
    <g fill="#FFB24C">
      <circle cx="86"  cy="176" r="1.4" opacity="0.5"/>
      <circle cx="198" cy="140" r="1.1" opacity="0.35"/>
      <circle cx="322" cy="164" r="1.5" opacity="0.45"/>
      <circle cx="430" cy="128" r="1.1" opacity="0.3"/>
      <circle cx="262" cy="96"  r="1.0" opacity="0.25"/>
    </g>

    <!-- Ember rim, the accent the launcher uses on its window edge -->
    <rect x="0.5" y="0.5" width="511" height="298" rx="10"
          fill="none" stroke="#FFB45A" stroke-opacity="0.22"/>
  </g>
</svg>
